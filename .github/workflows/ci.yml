name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs anteriores em PRs quando novo commit chega.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'
  PYTHON_VERSION: '3.12'

jobs:
  # --- Testes Go (unitários) ---
  test-go:
    name: Testes Go (unitários)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download deps
        working-directory: shim
        run: go mod download

      - name: Vet
        working-directory: shim
        run: go vet ./...

      - name: Build
        working-directory: shim
        run: go build -trimpath -o /tmp/dropin-server ./cmd/dropin-server

      - name: Test (com race detector)
        working-directory: shim
        run: go test -race -coverprofile=coverage.out ./...

      - name: Cobertura
        working-directory: shim
        if: success()
        run: |
          go tool cover -func=coverage.out | tail -20

  # --- Testes de Integração (boto3 contra shim em docker-compose) ---
  test-integration:
    name: Testes Integração (boto3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pytest requests

      - name: Subir docker-compose
        run: |
          docker compose up -d --build
          # Aguarda healthcheck do shim
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4566/readyz > /dev/null 2>&1; then
              echo "shim pronto"
              break
            fi
            sleep 1
          done

      - name: Rodar smoke tests
        run: |
          pytest shim/test/integration/ -v

      - name: Mostrar logs (em caso de falha)
        if: failure()
        run: |
          docker compose logs nats | tail -50
          docker compose logs shim | tail -50

      - name: Derrubar stack
        if: always()
        run: docker compose down -v

  # --- Lint (golangci-lint) ---
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: shim
          args: --timeout=5m

  # --- Build da imagem Docker ---
  build-image:
    name: Build imagem Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build shim
        uses: docker/build-push-action@v6
        with:
          context: .
          file: shim/Dockerfile
          tags: dropin-queue:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
